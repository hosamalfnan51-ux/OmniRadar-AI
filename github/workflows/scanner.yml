name: Global Opportunity Scanner
on:
  schedule:
    - cron: '0 0 * * *' # يعمل تلقائياً كل 24 ساعة
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          pip install urllib3

      - name: Scan and Update Database
        run: |
          python -c "
          import json, urllib.request, re
          try:
              # سحب مباشر ومضمون من خلاصات مجتمعات الأفكار والابتكار العالمية حياً
              url = 'https://techcrunch.com'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              html = urllib.request.urlopen(req, timeout=10).read().decode('utf-8')
              titles = re.findall('<title>(.*?)</title>', html)[2:7]
              
              new_data = []
              for t in titles:
                  if len(t) > 10:
                      new_data.append({
                          'market': 'Global Tech Market',
                          'tech': 'Artificial Intelligence & Startups',
                          'desc': f'New market challenge detected regarding: {t}',
                          'sol': 'Build an automated AI micro-service or SaaS tool targeting this precise ecosystem shift.'
                      })
              
              if new_data:
                  with open('world_problems.json', 'w', encoding='utf-8') as f:
                      json.dump(new_data, f, ensure_ascii=False, indent=2)
                  print('Database updated successfully!')
          except Exception as e:
              print(f'Error during automated scan: {e}')
          "

      - name: Save and Commit Data to Repository
        run: |
          git config --global user.name 'OmniRadar-Bot'
          git config --global user.email 'bot@omniradar.ai'
          git add world_problems.json
          git commit -m "Automated Global Market Scan [Realtime Update]" || exit 0
          git push
